<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed - Krishna Store</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <div class="logo">
            KRISHNA STORE
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="products.html">Products</a>

            <a href="cart.html">Cart 🛒</a>

            <a href="orders.html">My Orders</a>

        </nav>

    </header>


    <!-- Success Section -->

    <section class="success-section">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Order Confirmed! 🎉
            </h1>

            <p>
                Thank you for shopping with
                <strong>KRISHNA STORE</strong>.
            </p>

            <div class="success-details">

                <p>
                    <strong>Order ID:</strong>
                    <span id="order-id">
                        #KS000000
                    </span>
                </p>

                <p>
                    <strong>Total Amount:</strong> ₹
                    <span id="order-total">
                        0
                    </span>
                </p>

                <p>
                    <strong>Status:</strong> Order Confirmed ✅
                </p>

            </div>


            <div class="success-buttons">

                <a href="orders.html" class="checkout-btn">

                    📦 View My Orders

                </a>


                <a href="products.html" class="continue-btn">

                    🛍️ Continue Shopping

                </a>

            </div>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 KRISHNA STORE. All Rights Reserved.
        </p>

    </footer>


    <script>
        // Get saved Order ID

        const orderId =
            localStorage.getItem(
                "orderId"
            ) || "KS000000";


        document.getElementById(
                "order-id"
            ).textContent =
            "#" + orderId;


        // Get saved Order Total

        const total =
            localStorage.getItem(
                "orderTotal"
            ) || "0";


        document.getElementById(
                "order-total"
            ).textContent =
            total;
    </script>

</body>

</html>
